services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot_local}
      POSTGRES_DB: careerpilot
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerpilot -d careerpilot']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
